<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">obsidian-cli-mcp - Model Context Protocol Server for Obsidian</title>
  <desc id="hero-desc">基于官方 Obsidian CLI 操控笔记库的全功能专业级 MCP 服务器，保障运行时图谱协同并绕过 macOS TCC 权限限制。</desc>

  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bg-glow-purple" cx="78%" cy="28%" r="62%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.25" />
      <stop offset="55%" stop-color="#4C1D95" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#0D0F17" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="bg-glow-cyan" cx="18%" cy="75%" r="52%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0D0F17" stop-opacity="0" />
    </radialGradient>

    <!-- Card Background -->
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181D2B" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#10141F" stop-opacity="0.98" />
    </linearGradient>

    <!-- Clip for Terminal Frame -->
    <clipPath id="terminal-clip">
      <rect width="490" height="324" rx="16" />
    </clipPath>

    <!-- Official Obsidian Gem Facet Gradients -->
    <linearGradient id="obs-facet-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DDD6FE" />
      <stop offset="100%" stop-color="#A78BFA" />
    </linearGradient>
    <linearGradient id="obs-facet-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#6D28D9" />
    </linearGradient>
    <linearGradient id="obs-facet-right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6D28D9" />
      <stop offset="100%" stop-color="#4C1D95" />
    </linearGradient>

    <!-- Python Logo Dual Gradients -->
    <linearGradient id="py-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="py-yellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#EAB308" />
    </linearGradient>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="1200" height="420" rx="24" fill="#0D0F17" stroke="#232B3E" stroke-width="2"/>
  <rect width="1200" height="420" rx="24" fill="url(#bg-glow-purple)"/>
  <rect width="1200" height="420" rx="24" fill="url(#bg-glow-cyan)"/>

  <!-- Left Column: Branding, Value & Actions (width: ~540px) -->
  <g transform="translate(64, 48)">
    <!-- Top Pills Row: Category, Tool Count & Python Version (Spacious, well-proportioned) -->
    <g transform="translate(0, 0)">
      <!-- Pill 1: Model Context Protocol (Width 228) -->
      <rect width="228" height="30" rx="15" fill="#1E1B4B" stroke="#4338CA" stroke-width="1.2"/>
      <circle cx="16" cy="15" r="4.5" fill="#10B981"/>
      <circle cx="16" cy="15" r="8" fill="#10B981" fill-opacity="0.25"/>
      <text x="32" y="19.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#C7D2FE" letter-spacing="0.6">MODEL CONTEXT PROTOCOL</text>
      
      <!-- Pill 2: 13 Features (Width 114) -->
      <g transform="translate(238, 0)">
        <rect width="114" height="30" rx="15" fill="#3B0764" stroke="#7E22CE" stroke-width="1.2"/>
        <text x="57" y="19.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#E9D5FF" letter-spacing="0.5">13 FEATURES</text>
      </g>

      <!-- Pill 3: Python 3.10 – 3.15 with Authentic Python Dual-Snake Icon (Width 180) -->
      <g transform="translate(362, 0)">
        <rect width="180" height="30" rx="15" fill="#0F172A" stroke="#334155" stroke-width="1.2"/>
        
        <!-- Authentic Python Vector Icon (dual snake) -->
        <g transform="translate(13, 6) scale(0.145)">
          <!-- Blue Top Snake -->
          <path fill="url(#py-blue)" d="M63.391 1.988c-4.222.02-8.252.379-11.8 1.007-10.45 1.846-12.346 5.71-12.346 12.837v9.411h24.693v3.137H29.977c-7.176 0-13.46 4.313-15.426 12.521-2.268 9.405-2.368 15.275 0 25.096 1.755 7.311 5.947 12.519 13.124 12.519h8.491V67.234c0-8.151 7.051-15.34 15.426-15.34h24.665c6.866 0 12.346-5.654 12.346-12.548V15.833c0-6.693-5.646-11.72-12.346-12.837-4.244-.706-8.645-1.027-12.866-1.008zM50.037 9.557c2.55 0 4.634 2.117 4.634 4.721 0 2.593-2.083 4.69-4.634 4.69-2.56 0-4.633-2.097-4.633-4.69-.001-2.604 2.073-4.721 4.633-4.721z" transform="translate(0 10.26)"/>
          <!-- Yellow Bottom Snake -->
          <path fill="url(#py-yellow)" d="M91.682 28.38v10.966c0 8.5-7.208 15.655-15.426 15.655H51.591c-6.756 0-12.346 5.783-12.346 12.549v23.515c0 6.691 5.818 10.628 12.346 12.547 7.816 2.297 15.312 2.713 24.665 0 6.216-1.801 12.346-5.423 12.346-12.547v-9.412H63.938v-3.138h37.012c7.176 0 9.852-5.005 12.348-12.519 2.578-7.735 2.467-15.174 0-25.096-1.774-7.145-5.161-12.521-12.348-12.521h-9.268zM77.809 87.927c2.561 0 4.634 2.097 4.634 4.692 0 2.602-2.074 4.719-4.634 4.719-2.55 0-4.633-2.117-4.633-4.719 0-2.595 2.083-4.692 4.633-4.692z" transform="translate(0 10.26)"/>
        </g>
        
        <!-- Text Label -->
        <text x="100" y="19.5" text-anchor="middle" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" font-weight="700" fill="#E2E8F0">Python 3.10 – 3.15</text>
      </g>
    </g>

    <!-- Main Title with Official Obsidian Logo (from assets/obsidian-color.svg) -->
    <g transform="translate(0, 48)">
      <!-- Official Obsidian Gem Geometry Scaled to 44x44 -->
      <g transform="translate(0, 3) scale(1.85)">
        <path d="M9.643 14.012c.615-.183 1.605-.465 2.745-.534-.684-1.725-.849-3.235-.716-4.579.153-1.552.7-2.847 1.234-3.95.114-.235.223-.454.328-.664.149-.297.289-.577.42-.86.217-.47.378-.885.46-1.27.08-.38.08-.719-.014-1.044-.095-.325-.297-.675-.681-1.06a1.6 1.6 0 00-1.475.36l-4.95 4.453a1.602 1.602 0 00-.512.952l-.427 2.83c.67.592 2.327 2.317 3.335 4.71.09.213.174.432.253.656zM5.855 9.937c-.024.1-.057.197-.099.29L3.14 16.058a1.602 1.602 0 00.313 1.772l4.117 4.24c2.102-3.102 1.795-6.02.835-8.3-.728-1.73-1.832-3.083-2.55-3.833z" fill="url(#obs-facet-top)"/>
        <path d="M8.52 22.57c.073.01.146.018.22.02.781.023 2.095.091 3.16.288.87.16 2.593.642 4.011 1.056 1.082.316 2.197-.548 2.354-1.664.115-.814.33-1.735.725-2.58l-.009.004c-.67-1.87-1.523-3.077-2.417-3.847a5.294 5.294 0 00-2.777-1.258c-1.541-.216-2.952.189-3.841.45.532 2.218.368 4.828-1.425 7.53z" fill="url(#obs-facet-left)"/>
        <path d="M19.676 18.538a69.072 69.072 0 001.858-2.952.811.811 0 00-.061-.901c-.516-.684-1.504-2.075-2.042-3.362-.554-1.323-.636-3.378-.64-4.378a1.708 1.708 0 00-.359-1.051L15.235 1.83a3.757 3.757 0 01-.076.545c-.107.503-.307 1.004-.536 1.498-.135.29-.29.601-.446.915-.105.21-.21.42-.31.626-.517 1.068-.998 2.227-1.132 3.59-.125 1.262.046 2.73.814 4.484.128.01.257.025.386.043a6.364 6.364 0 013.327 1.506c.916.79 1.743 1.921 2.414 3.5z" fill="url(#obs-facet-right)"/>
      </g>

      <!-- Text Title -->
      <text x="56" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">obsidian-cli-mcp</text>
    </g>

    <!-- Tagline: Line 1 -->
    <text x="0" y="142" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="22" font-weight="700" fill="#F8FAFC">
      基于 Obsidian 官方 CLI 的全能 MCP 笔记管家
    </text>

    <!-- Value Mechanism: Line 2 -->
    <text x="0" y="174" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14.5" font-weight="400" fill="#94A3B8">
      与运行中的 Obsidian 实例实时通信 · 绕过 macOS 权限限制 · 状态即时同步
    </text>

    <!-- Quickstart Command Snippet Box -->
    <g transform="translate(0, 208)">
      <rect width="520" height="46" rx="12" fill="#161B26" stroke="#2B364F" stroke-width="1.4"/>
      <!-- Prompt symbol -->
      <text x="18" y="29" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="16" font-weight="700" fill="#38BDF8">$</text>
      <!-- Command text -->
      <text x="38" y="29" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="15.5" font-weight="500" fill="#F8FAFC">uvx obsidian-cli-mcp</text>
      <!-- Tag on the right -->
      <rect x="406" y="9" width="102" height="28" rx="8" fill="#064E3B" stroke="#059669" stroke-width="1"/>
      <text x="418" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="700" fill="#6EE7B7">ZERO-INSTALL</text>
    </g>

    <!-- Highlights Badges Row (3 Spacious, Uncrowded Cards totaling 520px) -->
    <g transform="translate(0, 276)">
      <!-- Badge 1: Official CLI Driven (width 160) -->
      <g transform="translate(0, 0)">
        <rect width="160" height="30" rx="8" fill="#1E2333" stroke="#333E5A" stroke-width="1"/>
        <path d="M 18,9 L 13,17 L 18,17 L 16,23 L 22,14 L 17,14 Z" fill="#FBBF24" />
        <text x="32" y="19.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="12.5" font-weight="600" fill="#E2E8F0">官方 CLI 驱动</text>
      </g>
      <!-- Badge 2: Bypass TCC (width 172) -->
      <g transform="translate(172, 0)">
        <rect width="172" height="30" rx="8" fill="#1E2333" stroke="#333E5A" stroke-width="1"/>
        <path d="M 18,9 L 23,11 L 23,16 C 23,19 20,22 18,23 C 16,22 13,19 13,16 L 13,11 Z" fill="#38BDF8" />
        <text x="32" y="19.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="12.5" font-weight="600" fill="#E2E8F0">免 macOS TCC 弹窗</text>
      </g>
      <!-- Badge 3: Live Sync (width 172) -->
      <g transform="translate(356, 0)">
        <rect width="164" height="30" rx="8" fill="#1E2333" stroke="#333E5A" stroke-width="1"/>
        <path d="M 18,10 A 5,5 0 0,1 22,15 L 20,15 L 23,18 L 26,15 L 24,15 A 7,7 0 0,0 17,8 Z M 16,20 A 5,5 0 0,1 12,15 L 14,15 L 11,12 L 8,15 L 10,15 A 7,7 0 0,0 17,22 Z" fill="#34D399" />
        <text x="33" y="19.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="12.5" font-weight="600" fill="#E2E8F0">图谱/缓存即时同步</text>
      </g>
    </g>
  </g>

  <!-- Right Column: Interactive Session Proof Mockup (width: 490px) -->
  <g transform="translate(646, 48)">
    <g clip-path="url(#terminal-clip)">
      <!-- Terminal Outer Frame -->
      <rect width="490" height="324" fill="url(#card-grad)" stroke="#2B3650" stroke-width="1.6"/>
      
      <!-- Window Titlebar -->
      <rect width="490" height="42" fill="#151924"/>
      <line x1="0" y1="42" x2="490" y2="42" stroke="#252F46" stroke-width="1"/>
      
      <!-- Window Control Dots -->
      <circle cx="22" cy="21" r="5" fill="#EF4444"/>
      <circle cx="39" cy="21" r="5" fill="#F59E0B"/>
      <circle cx="56" cy="21" r="5" fill="#10B981"/>
      
      <!-- Window Title -->
      <text x="245" y="25" text-anchor="middle" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12" font-weight="500" fill="#64748B">obsidian-mcp-session.log</text>

      <!-- Session Log Content -->
      <!-- Turn 1: Agent Request -->
      <g transform="translate(20, 64)">
        <rect width="60" height="20" rx="5" fill="#3B0764"/>
        <text x="8" y="14" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11" font-weight="700" fill="#E9D5FF">AGENT</text>
        <text x="70" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="13" fill="#E2E8F0">分析 "深度学习/知识图谱" 的双链关联拓扑</text>
      </g>

      <!-- Turn 2: MCP Protocol Tool Call -->
      <g transform="translate(20, 102)">
        <rect width="450" height="44" rx="8" fill="#0F131D" stroke="#222B3D" stroke-width="1"/>
        <text x="14" y="20" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#38BDF8">→ tools/call: </text>
        <text x="108" y="20" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12" font-weight="600" fill="#F1F5F9">obsidian.backlinks</text>
        <text x="14" y="36" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#94A3B8">args: {"file": "AI/KnowledgeGraph.md", "vault": "Research"}</text>
      </g>

      <!-- Turn 3: Obsidian CLI Execution -->
      <g transform="translate(20, 160)">
        <text x="2" y="15" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12" font-weight="600" fill="#A78BFA">⚡ CLI IPC Bridge:</text>
        <text x="130" y="15" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#CBD5E1">obsidian backlinks "AI/KnowledgeGraph.md"</text>
      </g>

      <!-- Turn 4: Result & Live Sync State -->
      <g transform="translate(20, 194)">
        <rect width="450" height="60" rx="8" fill="#06281E" stroke="#059669" stroke-width="1.2"/>
        <circle cx="18" cy="20" r="4" fill="#34D399"/>
        <text x="30" y="23" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#34D399">SUCCESS: 8 backlinks &amp; 14 forward links resolved</text>
        <text x="30" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="11.5" fill="#A7F3D0">✓ Dataview 内部索引即时同步 · 活跃标签页图谱状态无缝刷新</text>
      </g>

      <!-- Window Footer Status Bar -->
      <g transform="translate(0, 276)">
        <line x1="0" y1="0" x2="490" y2="0" stroke="#252F46" stroke-width="1"/>
        <rect width="490" height="48" fill="#131722"/>
        
        <!-- Status Indicator -->
        <circle cx="20" cy="24" r="4" fill="#10B981"/>
        <text x="30" y="28" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11" font-weight="600" fill="#E2E8F0">Connected (stdio)</text>

        <!-- Active Vault -->
        <text x="175" y="28" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#64748B">Vault: <tspan fill="#A78BFA">Active Vault</tspan></text>

        <!-- Protocol -->
        <text x="330" y="28" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#64748B">Protocol: <tspan fill="#38BDF8">MCP 2.3+</tspan></text>
      </g>
    </g>
    <!-- Crisp Outer Border with Rounded Corners -->
    <rect width="490" height="324" rx="16" fill="none" stroke="#2B3650" stroke-width="1.6"/>
  </g>
</svg>
