<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="workflow-title workflow-desc">
  <title id="workflow-title">obsidian-cli-mcp Architecture &amp; Workflow</title>
  <desc id="workflow-desc">架构与机制对比：Obsidian CLI 运行时 IPC 桥接对比传统直接文件读写的优势与工作流拓扑。</desc>

  <defs>
    <!-- Background Gradients -->
    <radialGradient id="wf-glow-purple" cx="80%" cy="20%" r="65%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.20" />
      <stop offset="60%" stop-color="#4C1D95" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#0D0F17" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="wf-glow-blue" cx="20%" cy="80%" r="55%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#0D0F17" stop-opacity="0" />
    </radialGradient>

    <!-- Linear Gradients for Cards -->
    <linearGradient id="card-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181D2B" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#111520" stop-opacity="0.98" />
    </linearGradient>
    <linearGradient id="card-alert" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#21151A" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#150E12" stop-opacity="0.95" />
    </linearGradient>
    
    <!-- Node Gradients -->
    <linearGradient id="node-agent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="node-mcp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#31104D" />
      <stop offset="100%" stop-color="#1E0A33" />
    </linearGradient>
    <linearGradient id="node-obsidian" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B2A22" />
      <stop offset="100%" stop-color="#061814" />
    </linearGradient>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="1200" height="390" rx="24" fill="#0D0F17" stroke="#232B3E" stroke-width="2"/>
  <rect width="1200" height="390" rx="24" fill="url(#wf-glow-purple)"/>
  <rect width="1200" height="390" rx="24" fill="url(#wf-glow-blue)"/>

  <!-- Header Block -->
  <g transform="translate(64, 40)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" fill="#A78BFA" letter-spacing="1.4">ARCHITECTURE &amp; MECHANISM</text>
    <text x="0" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="24" font-weight="800" fill="#FFFFFF">为什么通过 Obsidian 官方 CLI，而不是直接读写本地文件？</text>
  </g>

  <!-- Content Columns -->
  <!-- Left Side: Traditional Direct File Access (Warning / Limitation) -->
  <g transform="translate(64, 96)">
    <rect width="330" height="254" rx="16" fill="url(#card-alert)" stroke="#4A1D28" stroke-width="1.4"/>
    
    <!-- Header -->
    <g transform="translate(20, 20)">
      <rect width="92" height="22" rx="6" fill="#4C0519"/>
      <text x="8" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#FECDD3">传统方式缺陷</text>
      <text x="0" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="17" font-weight="700" fill="#FDA4AF">直接读写本地文件</text>
    </g>

    <!-- Limitation 1 -->
    <g transform="translate(20, 92)">
      <circle cx="8" cy="8" r="7" fill="#881337"/>
      <text x="5.5" y="11" font-family="'SF Mono', monospace" font-size="10" font-weight="800" fill="#FDA4AF">✕</text>
      <text x="24" y="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="13" font-weight="600" fill="#FFE4E6">macOS TCC 权限拦截</text>
      <text x="24" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="11.5" fill="#9F737E">外置进程读写目录易受全盘访问权限限制</text>
    </g>

    <!-- Limitation 2 -->
    <g transform="translate(20, 144)">
      <circle cx="8" cy="8" r="7" fill="#881337"/>
      <text x="5.5" y="11" font-family="'SF Mono', monospace" font-size="10" font-weight="800" fill="#FDA4AF">✕</text>
      <text x="24" y="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="13" font-weight="600" fill="#FFE4E6">图谱与 Dataview 滞后</text>
      <text x="24" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="11.5" fill="#9F737E">无法即时更新内存索引，需等待重扫或重启</text>
    </g>

    <!-- Limitation 3 -->
    <g transform="translate(20, 196)">
      <circle cx="8" cy="8" r="7" fill="#881337"/>
      <text x="5.5" y="11" font-family="'SF Mono', monospace" font-size="10" font-weight="800" fill="#FDA4AF">✕</text>
      <text x="24" y="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="13" font-weight="600" fill="#FFE4E6">无法联动 GUI 与插件生态</text>
      <text x="24" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="11.5" fill="#9F737E">无法调用内置命令、管理插件或控制布局</text>
    </g>
  </g>

  <!-- Right Side: Native CLI MCP Architecture (The Solution) -->
  <g transform="translate(418, 96)">
    <rect width="718" height="254" rx="16" fill="url(#card-dark)" stroke="#2B3650" stroke-width="1.4"/>
    
    <!-- Header -->
    <g transform="translate(24, 20)">
      <rect width="112" height="22" rx="6" fill="#064E3B"/>
      <text x="8" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#6EE7B7">RECOMMENDED</text>
      <text x="0" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="17" font-weight="700" fill="#38BDF8">
        obsidian-cli-mcp 运行时 IPC 桥接流程
      </text>
    </g>

    <!-- 3-Node Architecture Flow -->
    <g transform="translate(24, 76)">
      <!-- Connector 1: from Node 1 (175) to Node 2 (245) -> span 70px, center 210 -->
      <line x1="175" y1="42" x2="241" y2="42" stroke="#4F46E5" stroke-width="2" stroke-dasharray="4 2"/>
      <polygon points="244,42 237,38 237,46" fill="#818CF8"/>
      <text x="210" y="32" text-anchor="middle" font-family="'SF Mono', monospace" font-size="10" font-weight="600" fill="#818CF8">MCP stdio</text>

      <!-- Connector 2: from Node 2 (425) to Node 3 (495) -> span 70px, center 460 -->
      <line x1="425" y1="42" x2="491" y2="42" stroke="#7C3AED" stroke-width="2" stroke-dasharray="4 2"/>
      <polygon points="494,42 487,38 487,46" fill="#A78BFA"/>
      <text x="460" y="32" text-anchor="middle" font-family="'SF Mono', monospace" font-size="10" font-weight="600" fill="#C084FC">CLI IPC</text>

      <!-- Node 1: AI Clients (width 175) -->
      <g transform="translate(0, 0)">
        <rect width="175" height="84" rx="12" fill="url(#node-agent)" stroke="#334155" stroke-width="1.2"/>
        <text x="14" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#F8FAFC">AI Clients</text>
        <text x="14" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#94A3B8">Claude / Cursor / Codex</text>
        <rect x="14" y="52" width="147" height="20" rx="4" fill="#0F172A"/>
        <text x="20" y="66" font-family="'SF Mono', monospace" font-size="9.5" fill="#38BDF8">JSON-RPC 2.0 (stdio)</text>
      </g>

      <!-- Node 2: obsidian-cli-mcp Server (width 180, starts at 245) -->
      <g transform="translate(245, 0)">
        <rect width="180" height="84" rx="12" fill="url(#node-mcp)" stroke="#6D28D9" stroke-width="1.4"/>
        <text x="14" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#F5F3FF">obsidian-cli-mcp</text>
        <text x="14" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#DDD6FE">Fast Python Server</text>
        <rect x="14" y="52" width="152" height="20" rx="4" fill="#1E0A33"/>
        <text x="20" y="66" font-family="'SF Mono', monospace" font-size="9.5" fill="#C084FC">45 Tools · Schema 校验</text>
      </g>

      <!-- Node 3: Obsidian Electron Runtime (width 175, starts at 495) -->
      <g transform="translate(495, 0)">
        <rect width="175" height="84" rx="12" fill="url(#node-obsidian)" stroke="#059669" stroke-width="1.4"/>
        <text x="14" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#ECFDF5">Obsidian Desktop</text>
        <text x="14" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#6EE7B7">Active Electron Runtime</text>
        <rect x="14" y="52" width="147" height="20" rx="4" fill="#061814"/>
        <text x="20" y="66" font-family="'SF Mono', monospace" font-size="9.5" fill="#34D399">实时刷新图谱 / 缓存</text>
      </g>
    </g>

    <!-- Bottom Benefits Strip -->
    <g transform="translate(24, 182)">
      <rect width="670" height="52" rx="10" fill="#131824" stroke="#252F46" stroke-width="1"/>
      
      <!-- Benefit 1 -->
      <g transform="translate(18, 14)">
        <circle cx="6" cy="10" r="5" fill="#10B981"/>
        <text x="4" y="13" font-family="'SF Mono', monospace" font-size="8" font-weight="800" fill="#FFFFFF">✓</text>
        <text x="18" y="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="12" font-weight="600" fill="#F1F5F9">免 macOS TCC 弹窗</text>
        <text x="18" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="10.5" fill="#94A3B8">进程间通信无外部授权阻碍</text>
      </g>

      <!-- Benefit 2 -->
      <g transform="translate(236, 14)">
        <circle cx="6" cy="10" r="5" fill="#10B981"/>
        <text x="4" y="13" font-family="'SF Mono', monospace" font-size="8" font-weight="800" fill="#FFFFFF">✓</text>
        <text x="18" y="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="12" font-weight="600" fill="#F1F5F9">状态与索引瞬时同步</text>
        <text x="18" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="10.5" fill="#94A3B8">双链与元数据直写内存图谱</text>
      </g>

      <!-- Benefit 3 -->
      <g transform="translate(460, 14)">
        <circle cx="6" cy="10" r="5" fill="#10B981"/>
        <text x="4" y="13" font-family="'SF Mono', monospace" font-size="8" font-weight="800" fill="#FFFFFF">✓</text>
        <text x="18" y="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="12" font-weight="600" fill="#F1F5F9">原生控制工作区与插件</text>
        <text x="18" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="10.5" fill="#94A3B8">触发内置命令、模板与插件</text>
      </g>
    </g>
  </g>
</svg>
