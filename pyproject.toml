[project]
name = "obsidian-mcp"
version = "0.1.0"
description = "A MCP server to interact with Obsidian vault via Obsidian CLI"
readme = "README.md"
license = "MIT"
authors = [{ name = "AkimioJR", email = "akimio.jr@gmail.com" }]
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.3.0",
    "pydantic>=2.14.2",
]

[project.urls]
Homepage = "https://github.com/AkimioJR/obsidian-mcp"
Repository = "https://github.com/AkimioJR/obsidian-mcp.git"
Issues = "https://github.com/AkimioJR/obsidian-mcp/issues"

[project.scripts]
obsidian-mcp = "obsidian_mcp:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=1.4.1",
    "ruff>=0.17.3",
    "ty>=0.0.95",
]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
