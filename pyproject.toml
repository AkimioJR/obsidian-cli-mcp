[project]
name = "obsidian-cli-mcp"
version = "0.1.1"
description = "A MCP server to interact with Obsidian vault via Obsidian CLI"
readme = "README.md"
license = "MIT"
authors = [{ name = "AkimioJR", email = "akimio.jr@gmail.com" }]
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Utilities",
]
dependencies = [
    "mcp>=2.3.0",
    "pydantic>=2.14.2",
]

[project.urls]
Homepage = "https://github.com/AkimioJR/obsidian-cli-mcp"
Repository = "https://github.com/AkimioJR/obsidian-cli-mcp.git"
Issues = "https://github.com/AkimioJR/obsidian-cli-mcp/issues"

[project.scripts]
obsidian-cli-mcp = "obsidian_cli_mcp:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=1.4.1",
    "ruff>=0.17.3",
    "ty>=0.0.95",
]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
