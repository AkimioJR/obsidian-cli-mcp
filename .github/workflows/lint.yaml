name: lint

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  workflow_call:

jobs:
  lint:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux: full Python version coverage (fast & standard)
          - { os: ubuntu-latest, python-version: "3.10" }
          - { os: ubuntu-latest, python-version: "3.11" }
          - { os: ubuntu-latest, python-version: "3.12" }
          - { os: ubuntu-latest, python-version: "3.13" }
          - { os: ubuntu-latest, python-version: "3.14" }
          - { os: ubuntu-latest, python-version: "3.15" }

          # macOS & Windows: platform-specific paths, line endings, and subprocess testing
          - { os: macos-latest, python-version: "3.12" }
          - { os: macos-latest, python-version: "3.14" }
          - { os: windows-latest, python-version: "3.12" }
          - { os: windows-latest, python-version: "3.14" }

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install . ruff ty pytest pytest-asyncio

      - name: Run ruff check
        run: ruff check .

      - name: Run ruff format check
        run: ruff format --check .

      - name: Run ty check
        run: ty check src tests

      - name: Run pytest
        run: python -m pytest
